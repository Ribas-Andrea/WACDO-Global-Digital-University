<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="css/style.css" /> -->
    <link rel="stylesheet" href="css/style.min.css" />
    <!-- <link rel="stylesheet" href="css/index.css" /> -->
    <link rel="stylesheet" href="css/index.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />
    <title>WACDO</title>
  </head>
  <body>
    <div id="fond-ecran"></div>
    <section id="container-menu-accueil">
      <div id="menu-accueil-titre-p">
        <h1>Bonjour,</h1>

        <p id="question-choix-lieu">Souhaitez-vous consommer votre menu sur place ou préférez-vous l'emporter&nbsp;?</p>
      </div>
      <div id="container-btn-choix-lieu">
        <a href="#" class="btn-choix-lieu-sur-place">
          <picture>
            <source srcset="assets/webp/illustration-sur-place.webp" type="image/webp">
            <img class="btn-img-sur-place" src="assets/illustration-sur-place.png" alt="illustration sur place" />
          </picture>
          
          <span class="choix-lieu-sur-place">Sur Place</span>
        </a>

        <a href="#" class="btn-choix-lieu-emporter">
          <picture>
            <source srcset="assets/webp/illustration-a-emporter.webp" type="image/webp">
             <img class="btn-img-emporter" src="assets/illustration-a-emporter.png" alt="illustration a emporter" />
          </picture>
         
          <span class="choix-lieu-emporter">À Emporter</span>
        </a>
      </div>
    </section>

    <script src="./js/index.js"></script>
  </body>
</html>
