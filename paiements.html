<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wacdo</title>
    <!-- <link rel="stylesheet" href="css/style.css" /> -->
    <link rel="stylesheet" href="css/style.min.css" />
    <!-- <link rel="stylesheet" href="css/paiements.css" /> -->
    <link rel="stylesheet" href="css/paiements.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="container-page-paiement">
      <div id="container-titre"></div>

      <div class="container-panier-cb">
        <div class="container-panier">
          <div class="panier">
            <h2>Voici le détail de votre panier&nbsp;:</h2>
          </div>
        </div>

        <form class="container-cb" action="#">
          <fieldset>
            <legend>Veuillez sélectionner un mode de paiement&nbsp;:</legend>

            <div class="choix-cb">
              <input type="radio" class="choixRglt" id="carteBancaire" name="paiement" value="carte bancaire" />
              <label class="form-type-paiement" for="carteBancaire" tabindex="0"> 
                <picture>
                    <source srcset="./assets/webp/paiements/cb.webp" type="image/webp">
                    <img src="./assets/paiements/cb.jpg" alt="moyen de paiement cb" width="40" />
                </picture>
              Carte Bancaire 
              </label>

              <input type="radio" class="choixRglt" id="paypal" name="paiement" value="paypal" />
              <label class="form-type-paiement" for="paypal" tabindex="0">
                <picture>
                    <source srcset="./assets/webp/paiements/paypal.webp" type="image/webp">
                    <img src="./assets/paiements/paypal.jpg" alt="moyen de paiement paypal" width="40" />
                </picture>
              Paypal
              </label>

              <input type="radio" class="choixRglt" id="chqVacances" name="paiement" value="chèque vacances" />
              <label class="form-type-paiement" for="chqVacances" tabindex="0">
                <picture>
                    <source srcset="./assets/webp/paiements/chqvac.webp" type="image/webp">
                    <img src="./assets/paiements/chqvac.jfif" alt="moyen de paiement chèque vacances" width="40" />
                </picture>
                Chèque-Vacances Connect
                </label>

              <input type="radio" class="choixRglt" id="titresRestaurant" name="paiement" value="titres restaurant" />
              <label class="form-type-paiement" for="titresRestaurant" tabindex="0">
                <picture>
                    <source srcset="./assets/webp/paiements/titres.webp" type="image/webp">
                    <img src="./assets/paiements/titres.jfif" alt="moyen de paiement titres restaurants" width="40" />
                </picture>
              Titres-Restaurant
              </label>
            </div>

            <div class="container-btn-payer">
              <button class="btn-paiement" type="submit">Payer</button>
            </div>
          </fieldset>
        </form>
      </div>
    </div>
    <!-- <script type="module" src="./js/paiements.js"></script> -->
    <script type="module" src="./js/paiements.min.js"></script>
  </body>
</html>
