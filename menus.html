<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="css/menus.css" /> -->
    <link rel="stylesheet" href="css/menus.min.css" />
    <!-- <link rel="stylesheet" href="css/style.css" /> -->
    <link rel="stylesheet" href="css/style.min.css" />
    <!-- <link rel="stylesheet" href="css/popup.css" /> -->
    <link rel="stylesheet" href="css/popup.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />
    <title>Wacdo</title>
  </head>
  <body>
    <main id="page-choix-produits">
      <aside id="partie-gauche-choix-produits">
        <nav id="nav-page-produits">
          <picture>
            <source srcset="assets/webp/fleche-slider.webp" type="image/webp">
             <img id="fleche-gauche-nav" src="assets/fleche-slider.png" alt="fleche slider gauche" tabindex="0" />
          </picture>
          <div id="choix-categorie-produits">
            <div id="container-liste-categories"></div>
          </div>
          <picture>
            <source srcset="assets/webp/fleche-slider.webp" type="image/webp">
             <img class="fleche-droite-nav" src="assets/fleche-slider.png" alt="fleche slider droite" tabindex="0" />
          </picture>
        </nav>
        <section>
          <div id="container-nos-produits"></div>
          <div id="container-zone-choix"></div>
        </section>
        <div id="container-popup-menus"></div>
        <div id="container-popup-boissons"></div>
        <div id="container-popup-articles"></div>
        <div id="succes-commande"></div>
      </aside>

      <aside id="partie-droite-panier">
        <div id="container-panier">
          <picture>
            <source srcset="assets/webp/logo.webp" type="image/webp">
            <img class="logo-panier" src="assets/logo.png" alt="logo wacdo" tabindex="0"  />
          </picture>

          <div id="container-numero-commande">
            <div id="numero-commande">
              <div id="numero-emporter">
                <div>Commande numéro</div>
              </div>

              <div id="numero-sur-place">
                <p>Sur place&nbsp;:</p>
                <p id="numero-commande-sur-place"></p>
              </div>
            </div>
            <div id="numero-commande-emporter"></div>
          </div>
          <div class="barre-separation"></div>
          <div id="container-articles-panier"></div>
          <div class="barre-separation"></div>
          <div id="container-total-panier">
            <span id="total"
              >TOTAL <br />
              (ttc)</span
            >
            <span id="montant"> </span>
          </div>
          <div id="container-btn-panier">
            <button id="btn-abandon">Abandon</button>
            <button id="btn-payer">Payer</button>
          </div>
        </div>
      </aside>
    </main>

    <script src="./js/menus.js"></script>
    <script src="./js/panier.js"></script>
    <script src="./js/popup.js"></script>
  </body>
</html>
